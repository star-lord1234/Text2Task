<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" font-family="-apple-system, Helvetica, Arial, sans-serif"><title>Text2Task - Task details, edit-before-accept, ambiguous referent</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c53030"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7785"/></marker></defs><rect width="1440" height="900" fill="#e9edf1"/><rect x="0" y="0" width="1440" height="56" rx="0" fill="#ffffff" stroke="#cdd3da" stroke-width="1"/><text x="20" y="35" font-size="18" fill="#1f2933" font-weight="700" text-anchor="start">Text2Task</text><text x="140" y="35" font-size="14" fill="#1f2933" font-weight="600" text-anchor="start">Workspace</text><line x1="138" y1="50" x2="214" y2="50" stroke="#1f2933" stroke-width="3"/><text x="248" y="35" font-size="14" fill="#6b7785" font-weight="400" text-anchor="start">Dependencies</text><text x="400" y="35" font-size="13" fill="#6b7785" font-weight="400" text-anchor="start">Team: ML Project</text><rect x="640" y="14" width="236" height="28" rx="6" fill="#f4f6f8" stroke="#cdd3da" stroke-width="1"/><text x="650" y="33" font-size="12" fill="#1f2933" font-weight="400" text-anchor="start">Scenario A — Simple assignment  ▾</text><rect x="892" y="14" width="150" height="28" rx="14" fill="#f4f6f8" stroke="#cdd3da" stroke-width="1"/><rect x="894" y="16" width="72" height="24" rx="12" fill="#1f2933" stroke="#1f2933" stroke-width="1"/><text x="930" y="32" font-size="12" fill="#ffffff" font-weight="600" text-anchor="middle">Scripted</text><rect x="968" y="16" width="72" height="24" rx="12" fill="#f4f6f8" stroke="#f4f6f8" stroke-width="1"/><text x="1004" y="32" font-size="12" fill="#6b7785" font-weight="600" text-anchor="middle">Live</text><text x="1130" y="33" font-size="11" fill="#6b7785" font-weight="400" text-anchor="start">Active user</text><rect x="1204" y="12" width="216" height="32" rx="16" fill="#ffffff" stroke="#1f2933" stroke-width="1"/><circle cx="1222" cy="28" r="12" fill="#00a38c" stroke="#00a38c" stroke-width="1"/><text x="1222" y="32" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">A</text><text x="1242" y="33" font-size="13" fill="#1f2933" font-weight="600" text-anchor="start">Anushree</text><text x="1316" y="33" font-size="11" fill="#6b7785" font-weight="400" text-anchor="start">Data Engineer  ▾</text><rect x="0" y="56" width="1440" height="28" rx="0" fill="#fff4d6" stroke="#e8cf85" stroke-width="1"/><text x="36" y="75" font-size="12" fill="#7a5c00" font-weight="700" text-anchor="start">SCRIPTED DEMO</text><text x="156" y="75" font-size="12" fill="#7a5c00" font-weight="400" text-anchor="start">Entity/relation extraction is pre-written for this scenario. Reconciliation, review, history and the graph are the real code paths.</text><rect x="16" y="100" width="690" height="724" rx="6" fill="#ffffff" stroke="#cdd3da" stroke-width="1"/><text x="36" y="132" font-size="16" fill="#1f2933" font-weight="700" text-anchor="start">Task details</text><text x="682" y="132" font-size="15" fill="#6b7785" font-weight="400" text-anchor="end">✕</text><line x1="16" y1="146" x2="706" y2="146" stroke="#cdd3da" stroke-width="1"/><text x="36" y="174" font-size="11" fill="#6b7785" font-weight="400" text-anchor="start">Title</text><rect x="36" y="180" width="650" height="34" rx="6" fill="#ffffff" stroke="#1f2933" stroke-width="1"/><text x="48" y="203" font-size="14" fill="#1f2933" font-weight="700" text-anchor="start">Prepare cleaned dataset</text><text x="670" y="203" font-size="13" fill="#6b7785" font-weight="400" text-anchor="end">✎</text><text x="36" y="240" font-size="11" fill="#6b7785" font-weight="400" text-anchor="start">Owner</text><rect x="36" y="246" width="200" height="32" rx="6" fill="#ffffff" stroke="#cdd3da" stroke-width="1"/><circle cx="54" cy="262" r="10" fill="#00a38c" stroke="#00a38c" stroke-width="1"/><text x="54" y="266" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">A</text><text x="72" y="267" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start">Anushree  ▾</text><text x="256" y="240" font-size="11" fill="#6b7785" font-weight="400" text-anchor="start">Status</text><rect x="256" y="246" width="190" height="32" rx="6" fill="#ffffff" stroke="#cdd3da" stroke-width="1"/><text x="268" y="267" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start">☐ To do  ▾</text><text x="466" y="240" font-size="11" fill="#6b7785" font-weight="400" text-anchor="start">Version</text><rect x="466" y="250" width="28" height="20" rx="10" fill="#f4f6f8" stroke="#cdd3da" stroke-width="1"/><text x="474" y="264.0" font-size="11" fill="#1f2933" font-weight="500" text-anchor="start">v3</text><text x="516" y="264" font-size="11" fill="#6b7785" font-weight="400" text-anchor="start" font-style="italic">edits are version-checked</text><text x="36" y="306" font-size="11" fill="#6b7785" font-weight="400" text-anchor="start">Due</text><rect x="36" y="312" width="260" height="32" rx="6" fill="#ffffff" stroke="#cdd3da" stroke-width="1"/><text x="48" y="333" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start">Thu 12 Nov 2026</text><rect x="308" y="318" width="67" height="20" rx="10" fill="#e6f4ea" stroke="#a9d6b8" stroke-width="1"/><text x="316" y="332.0" font-size="11" fill="#2f855a" font-weight="500" text-anchor="start">RESOLVED</text><rect x="381" y="318" width="265" height="20" rx="10" fill="#f4f6f8" stroke="#cdd3da" stroke-width="1"/><text x="389" y="332.0" font-size="10.5" fill="#6b7785" font-weight="500" text-anchor="start">rule: weekday_bare · assumes message time</text><rect x="36" y="352" width="650" height="46" rx="6" fill="#fff8db" stroke="#e0c867" stroke-width="1"/><text x="48" y="372" font-size="11.5" fill="#7a5c00" font-weight="400" text-anchor="start">Unresolved example: “after approval” is stored as raw text with a reason and a question,</text><text x="48" y="389" font-size="11.5" fill="#7a5c00" font-weight="400" text-anchor="start">never a guessed date.  Missing timestamp → “Date needs a reference timestamp”.</text><text x="36" y="424" font-size="11" fill="#6b7785" font-weight="400" text-anchor="start">Source</text><rect x="36" y="430" width="650" height="44" rx="6" fill="#f4f6f8" stroke="#f4f6f8" stroke-width="1"/><text x="48" y="449" font-size="12" fill="#6b7785" font-weight="400" text-anchor="start" font-style="italic">“Anushree, please prepare the cleaned dataset by Thursday.”</text><text x="48" y="466" font-size="11" fill="#2b6cb0" font-weight="400" text-anchor="start">Riya · m1 · 09:30   ↗ show in chat   ·   ⓘ open in Inspector</text><text x="36" y="502" font-size="11" fill="#6b7785" font-weight="400" text-anchor="start">Dependencies</text><text x="36" y="522" font-size="12" fill="#1f2933" font-weight="400" text-anchor="start">Blocks:  Train entity model (Bianca)  — edge accepted from m3</text><text x="36" y="560" font-size="13" fill="#1f2933" font-weight="700" text-anchor="start">History (immutable)</text><circle cx="46" cy="586" r="5" fill="#ffffff" stroke="#1f2933" stroke-width="1"/><line x1="46" y1="591" x2="46" y2="622" stroke="#cdd3da" stroke-width="2"/><text x="62" y="590" font-size="11.5" fill="#6b7785" font-weight="400" text-anchor="start">09:30</text><text x="108" y="590" font-size="12" fill="#1f2933" font-weight="700" text-anchor="start">CREATE_TASK</text><text x="236" y="590" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start">by Riya</text><rect x="336" y="577" width="107" height="18" rx="9" fill="#f4f6f8" stroke="#cdd3da" stroke-width="1"/><text x="344" y="589.6" font-size="10.5" fill="#1f2933" font-weight="500" text-anchor="start">rule · scripted</text><text x="108" y="608" font-size="11.5" fill="#6b7785" font-weight="400" text-anchor="start">→ owner Anushree, due Thu 12 Nov</text><circle cx="46" cy="634" r="5" fill="#ffffff" stroke="#1f2933" stroke-width="1"/><line x1="46" y1="639" x2="46" y2="670" stroke="#cdd3da" stroke-width="2"/><text x="62" y="638" font-size="11.5" fill="#6b7785" font-weight="400" text-anchor="start">09:32</text><text x="108" y="638" font-size="12" fill="#1f2933" font-weight="700" text-anchor="start">NO_ACTION</text><text x="236" y="638" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start">by Anushree</text><rect x="336" y="625" width="40" height="18" rx="9" fill="#f4f6f8" stroke="#cdd3da" stroke-width="1"/><text x="344" y="637.6" font-size="10.5" fill="#1f2933" font-weight="500" text-anchor="start">rule</text><text x="108" y="656" font-size="11.5" fill="#6b7785" font-weight="400" text-anchor="start">restates this task; no duplicate (matched T-1)</text><circle cx="46" cy="682" r="5" fill="#ffffff" stroke="#1f2933" stroke-width="1"/><line x1="46" y1="687" x2="46" y2="718" stroke="#cdd3da" stroke-width="2"/><text x="62" y="686" font-size="11.5" fill="#6b7785" font-weight="400" text-anchor="start">09:35</text><text x="108" y="686" font-size="12" fill="#1f2933" font-weight="700" text-anchor="start">ADD_DEPENDENCY</text><text x="236" y="686" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start">by Riya</text><rect x="336" y="673" width="40" height="18" rx="9" fill="#f4f6f8" stroke="#cdd3da" stroke-width="1"/><text x="344" y="685.6" font-size="10.5" fill="#1f2933" font-weight="500" text-anchor="start">rule</text><text x="108" y="704" font-size="11.5" fill="#6b7785" font-weight="400" text-anchor="start">this task now blocks T-2</text><circle cx="46" cy="730" r="5" fill="#1f2933" stroke="#1f2933" stroke-width="1"/><text x="62" y="734" font-size="11.5" fill="#6b7785" font-weight="400" text-anchor="start">09:50</text><text x="108" y="734" font-size="12" fill="#1f2933" font-weight="700" text-anchor="start">MANUAL_EDIT</text><text x="236" y="734" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start">by Anushree</text><rect x="336" y="721" width="46" height="18" rx="9" fill="#efe9ff" stroke="#b8a8f0" stroke-width="1"/><text x="344" y="733.6" font-size="10.5" fill="#4b3bb0" font-weight="500" text-anchor="start">human</text><text x="108" y="752" font-size="11.5" fill="#6b7785" font-weight="400" text-anchor="start">title: “Prepare dataset” → “Prepare cleaned dataset”</text><text x="36" y="786" font-size="11" fill="#6b7785" font-weight="400" text-anchor="start" font-style="italic">Manual corrections are recorded as human edits, never as model predictions.</text><rect x="516" y="782" width="170" height="30" rx="15" fill="#ffffff" stroke="#1f2933" stroke-width="1"/><text x="601" y="802" font-size="12.5" fill="#1f2933" font-weight="600" text-anchor="middle">Mark done</text><rect x="722" y="100" width="702" height="340" rx="6" fill="#ffffff" stroke="#cdd3da" stroke-width="1"/><text x="742" y="130" font-size="15" fill="#1f2933" font-weight="700" text-anchor="start">Edit suggestion before accepting</text><rect x="1094" y="114" width="86" height="20" rx="10" fill="#f4f6f8" stroke="#cdd3da" stroke-width="1"/><text x="1102" y="128.0" font-size="11" fill="#1f2933" font-weight="500" text-anchor="start">Create task</text><line x1="722" y1="144" x2="1424" y2="144" stroke="#cdd3da" stroke-width="1"/><text x="742" y="170" font-size="11" fill="#6b7785" font-weight="400" text-anchor="start">Assignee</text><rect x="742" y="176" width="300" height="34" rx="6" fill="#ffffff" stroke="#c53030" stroke-width="2"/><text x="754" y="198" font-size="12.5" fill="#6b7785" font-weight="400" text-anchor="start">Choose…  ▾</text><rect x="1054" y="183" width="149" height="20" rx="10" fill="#fde8e8" stroke="#f0b3b3" stroke-width="1"/><text x="1062" y="197.0" font-size="11" fill="#c53030" font-weight="500" text-anchor="start">⚠ Assignee unresolved</text><text x="742" y="232" font-size="11.5" fill="#6b7785" font-weight="400" text-anchor="start">Candidates from the message: “you” matches 2 people (Anushree, Bianca) — we do not guess.</text><text x="742" y="262" font-size="11" fill="#6b7785" font-weight="400" text-anchor="start">Due</text><rect x="742" y="268" width="300" height="34" rx="6" fill="#ffffff" stroke="#cdd3da" stroke-width="1"/><text x="754" y="290" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start">next Friday</text><rect x="1054" y="275" width="188" height="20" rx="10" fill="#fff4d6" stroke="#e8cf85" stroke-width="1"/><text x="1062" y="289.0" font-size="11" fill="#7a5c00" font-weight="500" text-anchor="start">needs a reference timestamp</text><text x="742" y="326" font-size="11" fill="#6b7785" font-weight="400" text-anchor="start">Title</text><rect x="742" y="332" width="660" height="34" rx="6" fill="#ffffff" stroke="#cdd3da" stroke-width="1"/><text x="754" y="354" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start">Train entity model</text><rect x="742" y="386" width="150" height="32" rx="16" fill="#1f2933" stroke="#1f2933" stroke-width="1"/><text x="817.0" y="407" font-size="12.5" fill="#ffffff" font-weight="600" text-anchor="middle">Accept with edits</text><rect x="902" y="386" width="90" height="32" rx="16" fill="#ffffff" stroke="#1f2933" stroke-width="1"/><text x="947.0" y="407" font-size="12.5" fill="#1f2933" font-weight="600" text-anchor="middle">Cancel</text><text x="742" y="432" font-size="11" fill="#6b7785" font-weight="400" text-anchor="start" font-style="italic">Accept is disabled until required fields are resolved or explicitly left blank.</text><rect x="722" y="456" width="702" height="368" rx="6" fill="#fffdf6" stroke="#e8cf85" stroke-width="1"/><text x="742" y="486" font-size="15" fill="#1f2933" font-weight="700" text-anchor="start">Which task does this refer to?</text><rect x="992" y="470" width="130" height="20" rx="10" fill="#fff4d6" stroke="#e8cf85" stroke-width="1"/><text x="1000" y="484.0" font-size="11" fill="#7a5c00" font-weight="500" text-anchor="start">ambiguous referent</text><rect x="742" y="498" width="662" height="44" rx="6" fill="#ffffff" stroke="#cdd3da" stroke-width="1"/><text x="754" y="517" font-size="12.5" fill="#1f2933" font-weight="700" text-anchor="start">Bianca: “I've finished the report.”</text><text x="754" y="534" font-size="11.5" fill="#6b7785" font-weight="400" text-anchor="start">No task was changed. Two open tasks mention “report”.</text><rect x="742" y="556" width="662" height="66" rx="8" fill="#ffffff" stroke="#2b6cb0" stroke-width="2"/><circle cx="762" cy="580" r="8" fill="#2b6cb0" stroke="#2b6cb0" stroke-width="1"/><text x="782" y="584" font-size="13" fill="#1f2933" font-weight="700" text-anchor="start">T-1  Prepare the report</text><circle cx="792" cy="602" r="9" fill="#e17055" stroke="#e17055" stroke-width="1"/><text x="792" y="606" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">B</text><text x="808" y="606" font-size="11.5" fill="#6b7785" font-weight="400" text-anchor="start">Bianca (owner = speaker)</text><text x="1062" y="606" font-size="11" fill="#6b7785" font-weight="400" text-anchor="start" font-style="italic">score 52 · owner matches speaker</text><rect x="742" y="630" width="662" height="66" rx="8" fill="#ffffff" stroke="#cdd3da" stroke-width="1"/><circle cx="762" cy="654" r="8" fill="#ffffff" stroke="#6b7785" stroke-width="1"/><text x="782" y="658" font-size="13" fill="#1f2933" font-weight="700" text-anchor="start">T-2  Review the report</text><circle cx="792" cy="676" r="9" fill="#00a38c" stroke="#00a38c" stroke-width="1"/><text x="792" y="680" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">A</text><text x="808" y="680" font-size="11.5" fill="#6b7785" font-weight="400" text-anchor="start">Anushree</text><text x="1062" y="680" font-size="11" fill="#6b7785" font-weight="400" text-anchor="start" font-style="italic">score 40 · same object word</text><text x="742" y="724" font-size="11.5" fill="#6b7785" font-weight="400" text-anchor="start">Candidates are shown with their score and the signals that produced it (explicit rule trace).</text><rect x="742" y="744" width="150" height="32" rx="16" fill="#1f2933" stroke="#1f2933" stroke-width="1"/><text x="817.0" y="765" font-size="12.5" fill="#ffffff" font-weight="600" text-anchor="middle">Choose &amp; accept</text><rect x="902" y="744" width="90" height="32" rx="16" fill="#ffffff" stroke="#cdd3da" stroke-width="1"/><text x="947.0" y="765" font-size="12.5" fill="#6b7785" font-weight="600" text-anchor="middle">Dismiss</text><rect x="1002" y="744" width="120" height="32" rx="16" fill="#ffffff" stroke="#1f2933" stroke-width="1"/><text x="1062.0" y="765" font-size="12.5" fill="#1f2933" font-weight="600" text-anchor="middle">None of these</text><text x="742" y="800" font-size="11" fill="#6b7785" font-weight="400" text-anchor="start" font-style="italic">Nothing changes until you choose: never silently overwrites an unrelated task.</text><rect x="0" y="836" width="1440" height="64" rx="0" fill="#ffffff" stroke="#cdd3da" stroke-width="1"/><text x="20" y="862" font-size="13" fill="#1f2933" font-weight="700" text-anchor="start">Scenario A — Simple assignment</text><text x="20" y="882" font-size="11.5" fill="#6b7785" font-weight="400" text-anchor="start">Step 3 of 5</text><circle cx="16" cy="100" r="11" fill="#1f2933" stroke="#1f2933" stroke-width="1"/><text x="16" y="104" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><circle cx="682" cy="306" r="11" fill="#1f2933" stroke="#1f2933" stroke-width="1"/><text x="682" y="310" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><circle cx="682" cy="560" r="11" fill="#1f2933" stroke="#1f2933" stroke-width="1"/><text x="682" y="564" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><circle cx="722" cy="100" r="11" fill="#1f2933" stroke="#1f2933" stroke-width="1"/><text x="722" y="104" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><circle cx="722" cy="456" r="11" fill="#1f2933" stroke="#1f2933" stroke-width="1"/><text x="722" y="460" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">5</text></svg>