="start">train the entity model</text><rect x="1071.2" y="324" width="111" height="20" rx="10" fill="#f4f6f8" stroke="#cdd3da" stroke-width="1"/><text x="1079.2" y="338.0" font-size="11" fill="#1f2933" font-weight="500" text-anchor="start">→ ASSIGNED_TO →</text><text x="894" y="362" font-size="12.5" fill="#4b3bb0" font-weight="700" text-anchor="start">Bianca</text><rect x="1304" y="324" width="64" height="18" rx="9" fill="#fff4d6" stroke="#e8cf85" stroke-width="1"/><text x="1312" y="336.6" font-size="10.5" fill="#7a5c00" font-weight="500" text-anchor="start">scripted</text><text x="894" y="384" font-size="11.5" fill="#6b7785" font-weight="400" text-anchor="start">relation score: —  (scripted fixture, no model score)</text><text x="894" y="400" font-size="11.5" fill="#6b7785" font-weight="400" text-anchor="start" font-style="italic">evidence: “Bianca, please train the entity model”</text><rect x="880" y="418" width="540" height="92" rx="8" fill="#ffffff" stroke="#cdd3da" stroke-width="1"/><text x="894" y="442" font-size="12.5" fill="#1f5fa8" font-weight="700" text-anchor="start">train the entity model</text><rect x="1071.2" y="426" width="105" height="20" rx="10" fill="#f4f6f8" stroke="#cdd3da" stroke-width="1"/><text x="1079.2" y="440.0" font-size="11" fill="#1f2933" font-weight="500" text-anchor="start">→ DEPENDS_ON →</text><text x="894" y="464" font-size="12.5" fill="#1f5fa8" font-weight="700" text-anchor="start">Anushree finishes the dataset</text><rect x="1304" y="426" width="40" height="18" rx="9" fill="#e8f0fb" stroke="#b8cdee" stroke-width="1"/><text x="1312" y="438.6" font-size="10.5" fill="#2b6cb0" font-weight="500" text-anchor="start">rule</text><text x="894" y="486" font-size="11.5" fill="#6b7785" font-weight="400" text-anchor="start">cue: “once” between two task spans (explicit prerequisite wording)</text><text x="894" y="502" font-size="11.5" fill="#6b7785" font-weight="400" text-anchor="start" font-style="italic">proposed edge: Prepare cleaned dataset → Train entity model</text><rect x="880" y="520" width="540" height="30" rx="4" fill="#fff8db" stroke="#e0c867" stroke-width="1"/><text x="890" y="540" font-size="11.5" fill="#7a5c00" font-weight="400" text-anchor="start">Model scores, when present, are uncalibrated softmax values — not probabilities.</text><rect x="880" y="566" width="540" height="72" rx="8" fill="#ffffff" stroke="#cdd3da" stroke-width="1"/><text x="894" y="590" font-size="13" fill="#1f2933" font-weight="700" text-anchor="start">▸ Resolution</text><text x="894" y="610" font-size="11.5" fill="#6b7785" font-weight="400" text-anchor="start">“Thursday” → 2026-11-12  (anchor: message time, America/Chicago, rule weekday_bare)</text><text x="894" y="626" font-size="11.5" fill="#6b7785" font-weight="400" text-anchor="start">Unresolved example: “after approval” → event condition, kept as raw text</text><rect x="880" y="648" width="540" height="72" rx="8" fill="#ffffff" stroke="#cdd3da" stroke-width="1"/><text x="894" y="672" font-size="13" fill="#1f2933" font-weight="700" text-anchor="start">▸ Reconciliation</text><text x="894" y="692" font-size="11.5" fill="#6b7785" font-weight="400" text-anchor="start">CREATE_TASK “Train entity model” (owner Bianca) + ADD_DEPENDENCY on T-1</text><text x="894" y="708" font-size="11.5" fill="#6b7785" font-weight="400" text-anchor="start">Referent T-1 matched by overlap “dataset” (score shown) · a rule trace, not model reasoning</text><rect x="880" y="730" width="540" height="118" rx="8" fill="#f4f6f8" stroke="#f4f6f8" stroke-width="1"/><text x="894" y="754" font-size="13" fill="#1f2933" font-weight="700" text-anchor="start">Provenance</text><rect x="894" y="762" width="54" height="20" rx="10" fill="#e6f4ea" stroke="#a9d6b8" stroke-width="1"/><text x="902" y="776.0" font-size="11" fill="#2f855a" font-weight="500" text-anchor="start">neural</text><rect x="954" y="762" width="41" height="20" rx="10" fill="#e8f0fb" stroke="#b8cdee" stroke-width="1"/><text x="962" y="776.0" font-size="11" fill="#2b6cb0" font-weight="500" text-anchor="start">rule</text><rect x="1001" y="762" width="67" height="20" rx="10" fill="#fff4d6" stroke="#e8cf85" stroke-width="1"/><text x="1009" y="776.0" font-size="11" fill="#7a5c00" font-weight="500" text-anchor="start">scripted</text><rect x="1074" y="762" width="47" height="20" rx="10" fill="#efe9ff" stroke="#b8a8f0" stroke-width="1"/><text x="1082" y="776.0" font-size="11" fill="#4b3bb0" font-weight="500" text-anchor="start">human</text><text x="1133" y="777" font-size="11" fill="#6b7785" font-weight="400" text-anchor="start" font-style="italic">← every result carries exactly one of these</text><text x="894" y="800" font-size="11.5" fill="#6b7785" font-weight="400" text-anchor="start">entity: entity_v2_three_class · epoch3_sqrt_weighted · provisional SILVER · mps</text><text x="894" y="818" font-size="11.5" fill="#6b7785" font-weight="400" text-anchor="start">relations: relations-markers_sqrt · provisional SILVER · run r-0f3a · LIVE · rule linker OFF</text><text x="894" y="836" font-size="11.5" fill="#6b7785" font-weight="400" text-anchor="start" font-style="italic">Never shown: attention weights or logits as an “explanation”.</text><circle cx="868" cy="122" r="11" fill="#1f2933" stroke="#1f2933" stroke-width="1"/><text x="868" y="126" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><circle cx="868" cy="262" r="11" fill="#1f2933" stroke="#1f2933" stroke-width="1"/><text x="868" y="266" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><circle cx="868" cy="316" r="11" fill="#1f2933" stroke="#1f2933" stroke-width="1"/><text x="868" y="320" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><circle cx="868" cy="566" r="11" fill="#1f2933" stroke="#1f2933" stroke-width="1"/><text x="868" y="570" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><circle cx="868" cy="730" r="11" fill="#1f2933" stroke="#1f2933" s