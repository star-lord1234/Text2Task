{
  "experiment_name": "text2task-distilbert-entities-v1",
  "evaluation": {
    "mode": "provisional_silver",
    "provisional_metric_prefix": "silver_provisional",
    "gold_metric_prefix": "gold",
    "disclaimer": "SILVER validation metrics are provisional development signals, not human-grounded research results."
  },
  "model": {
    "name": "distilbert/distilbert-base-uncased",
    "architecture": "AutoModelForTokenClassification"
  },
  "paths": {
    "entity_data": "data/model_ready/entities",
    "final_data": "data/final",
    "schema": "configs/text2task_schema_v1.json",
    "vocab": "configs/tokenizers/distilbert-base-uncased-vocab.txt",
    "model_output": "models/text2task-distilbert",
    "results": "results/entity_extraction"
  },
  "data": {
    "max_length": 512,
    "stride": 64,
    "windowing": "source preprocessing uses overlapping WordPiece windows and assigns each complete entity to one containing window",
    "overlap_strategy": "inject [unusedN] after [CLS] to identify deterministic BIO overlap layer N",
    "train_annotation_tiers": ["GOLD", "SILVER"],
    "validation_annotation_tiers_by_mode": {
      "provisional_silver": ["SILVER"],
      "gold_evaluation": ["GOLD"]
    }
  },
  "training": {
    "learning_rate": 0.00002,
    "num_train_epochs": 3,
    "per_device_train_batch_size": 4,
    "per_device_eval_batch_size": 4,
    "gradient_accumulation_steps": 4,
    "weight_decay": 0.01,
    "warmup_ratio": 0.0,
    "evaluation_strategy": "epoch",
    "save_strategy": "epoch",
    "logging_strategy": "steps",
    "logging_steps": 10,
    "load_best_model_at_end": true,
    "metric_for_best_model": "f1",
    "greater_is_better": true,
    "save_total_limit": 3,
    "seed": 20261101,
    "data_seed": 20261101
  }
}
